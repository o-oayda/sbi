$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- observation_id
- catalogue_version
- base_mask_version
- catalogue_sha256
- mask_sha256
- native_nside
- downscale_nside
- native_count_summary
- w1_min
- w1_max
- w12_min
- mask_north_ecliptic
additionalProperties: false
properties:
  observation_id:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
  catalogue_version:
    const: S21
  base_mask_version:
    const: S21
  catalogue_sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
  mask_sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
  native_nside:
    const: 64
  downscale_nside:
    enum:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
  native_pseudo_cl:
    type: boolean
  native_count_summary:
    const: log_dispersion
  w1_min:
    type: number
    minimum: 9
  w1_max:
    type: number
    maximum: 16.5
  w12_min:
    const: 0.8
  mask_north_ecliptic:
    type: boolean
