$schema: https://json-schema.org/draft/2020-12/schema

type: object
required: [data_locations]
additionalProperties: false

properties:
  data_locations:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
    additionalProperties:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
