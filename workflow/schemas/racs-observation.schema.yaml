$schema: https://json-schema.org/draft/2020-12/schema

type: object
required:
  - observation_id
  - datasets
  - args
  - mask
additionalProperties: false

allOf:
  - if:
      properties:
        args:
          required: [temperature_fallback]
          properties:
            temperature_fallback: {const: reference}
    then:
      properties:
        args:
          required:
            - paf_reference_temp_c
            - max_reference_fallback_tiles
    else:
      properties:
        args:
          not:
            anyOf:
              - required: [paf_reference_temp_c]
              - required: [max_reference_fallback_tiles]

properties:
  observation_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"

  datasets:
    type: object
    required: [catalogue, paf_temperatures, noise_maps]
    additionalProperties: false
    properties:
      catalogue:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
      paf_temperatures:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
      noise_maps:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"

  args:
    type: object
    required:
      - racs_epoch
      - flux_min
      - noise_map_nside
      - flux_error_noise_bins
      - flux_error_flux_bins
      - flux_error_min_cell_count
      - flux_error_noise_bounds_ujy_beam
      - flux_error_flux_bounds_mjy
      - local_source_crossmatch_radius_arcsec
      - nside
      - downscale_nside
      - use_jax
      - chunk_size
      - temperature_fallback
      - summary_features
      - flux_temperature_n_bins
      - flux_temperature_quantiles
      - flux_elevation_n_bins
      - flux_elevation_quantiles
    additionalProperties: false

    properties:
      racs_epoch:
        enum: [low3, mid1]

      flux_min:
        type: number
        exclusiveMinimum: 0

      flux_temperature_min_mjy:
        type: [number, "null"]
        exclusiveMinimum: 0

      noise_map_nside:
        type: integer
        enum: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
        default: 256

      flux_error_noise_bins:
        type: integer
        minimum: 2
        default: 200

      flux_error_flux_bins:
        type: integer
        minimum: 2
        default: 300

      flux_error_min_cell_count:
        type: integer
        minimum: 1
        default: 10

      flux_error_noise_bounds_ujy_beam:
        description: Product-specific noise bounds configured explicitly.
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
          exclusiveMinimum: 0

      flux_error_flux_bounds_mjy:
        description: Flux bounds configured explicitly for reproducibility.
        type: array
        minItems: 2
        maxItems: 2
        default: [0.1, 10_000.0]
        items:
          type: number
          exclusiveMinimum: 0

      local_source_crossmatch_radius_arcsec:
        type: [number, "null"]
        exclusiveMinimum: 0

      nside:
        type: integer
        minimum: 1

      downscale_nside:
        type: [integer, "null"]
        minimum: 1

      use_jax:
        type: boolean

      chunk_size:
        type: integer
        minimum: 1

      temperature_fallback:
        enum: [none, open_meteo, reference]

      paf_reference_temp_c:
        type: number

      max_reference_fallback_tiles:
        type: integer
        minimum: 1

      summary_features:
        type: array
        uniqueItems: true
        items:
          enum:
            - log_dispersion
            - flux_quantiles
            - flux_elevation_quantiles

      flux_temperature_n_bins:
        type: integer
        minimum: 1

      flux_temperature_quantiles:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: number
          minimum: 0
          maximum: 1

      flux_elevation_n_bins:
        type: integer
        minimum: 1

      flux_elevation_quantiles:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: number
          minimum: 0
          maximum: 1

  mask:
    type: object
    required:
      - galactic_plane_width_deg
      - north_equatorial_pole_radius_deg
      - default_a_team_radius_deg
    additionalProperties: false

    properties:
      galactic_plane_width_deg:
        type: number
        minimum: 0
        maximum: 90

      north_equatorial_pole_radius_deg:
        type: number
        minimum: 0
        maximum: 180

      default_a_team_radius_deg:
        type: number
        minimum: 0
        maximum: 180

      source_radii_deg:
        type: object
        additionalProperties: false
        properties:
          Cygnus A:
            type: number
            minimum: 0
            maximum: 180
          LMC:
            type: number
            minimum: 0
            maximum: 180
          SMC:
            type: number
            minimum: 0
            maximum: 180
