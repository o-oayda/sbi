[project]
name = "dipolesbi"
version = "0.1.0"
description = "Fit dipoles using simulation-based inference."
authors = [
    {name = "Oliver Oayda",email = "oaydaoliver@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "healpy (>=1.18.1,<2.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "dill (>=0.4.0,<0.5.0)",
    "astropy (>=7.0.2,<8.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "corner (>=2.2.3,<3.0.0)",
    "dynesty (>=2.1.5,<3.0.0)",
    "emcee (>=3.1.6,<4.0.0)",
    "pymc (>=5.25.1,<6.0.0)", # get around this issue: AttributeError: module 'numpy.__config__' has no attribute 'get_info'
    "memory-profiler (>=0.61.0,<0.62.0)",
    "harmonic (>=1.3.0,<2.0.0)",
    "jax (==0.6.2)",
    "jaxlib (==0.6.2)",
    "ultranest (>=4.4.0,<5.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "surjectors @ git+https://github.com/o-oayda/surjectors.git@main",
    "blackjax @ git+https://github.com/handley-lab/blackjax@95e93ed93e726b95143b2f4a9582888621625f52",
    "anesthetic (<= 2.10.3)",
    "pytest (>=9.0.1,<10.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "catsim @ git+https://github.com/o-oayda/catsim.git@v0.1.0",
    "dipole-utils @ git+https://github.com/o-oayda/dipole-utils.git@main",
    "importlib-resources (==6.5.2)",
    "sniffio (==1.3.1)",
    "types-python-dateutil (==2.9.0.20251008)",
]

[project.scripts]
dipolesbi-validate-racs-data = "dipolesbi.pipelines.validate_racs_data:main"
dipolesbi-prepare-racs-observation = "dipolesbi.pipelines.prepare_racs_observation:main"
dipolesbi-infer-racs = "dipolesbi.pipelines.based_racs:main"
dipolesbi-package-racs-analysis = "dipolesbi.pipelines.package_racs_analysis:main"

[project.optional-dependencies]
cuda = [
    "jax-cuda12-pjrt (==0.6.2)",
    "jax-cuda12-plugin[with-cuda] (==0.6.2)",
    "nvidia-cublas-cu12 (==12.9.1.4)",
    "nvidia-cuda-cupti-cu12 (==12.9.79)",
    "nvidia-cuda-nvcc-cu12 (==12.9.86)",
    "nvidia-cuda-nvrtc-cu12 (==12.9.86)",
    "nvidia-cuda-runtime-cu12 (==12.9.79)",
    "nvidia-cudnn-cu12 (==9.13.1.26)",
    "nvidia-cufft-cu12 (==11.4.1.4)",
    "nvidia-cusolver-cu12 (==11.7.5.82)",
    "nvidia-cusparse-cu12 (==12.5.10.65)",
    "nvidia-nccl-cu12 (==2.28.3)",
    "nvidia-nvjitlink-cu12 (==12.9.86)",
    "nvidia-nvshmem-cu12 (==3.4.5)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "snakemake>=9,<10",
]
