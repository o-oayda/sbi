$schema: https://json-schema.org/draft/2020-12/schema

type: object
required:
  - observation_id
  - catalogue_path
  - args
  - mask
additionalProperties: false

properties:
  observation_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"

  catalogue_path:
    type: string
    minLength: 1

  args:
    type: object
    required:
      - racs_epoch
      - flux_min
      - fractional_error_flux_min_mjy
      - local_source_crossmatch_radius_arcsec
      - nside
      - downscale_nside
      - use_jax
      - chunk_size
      - paf_temperature_data_dir
      - openmeteo_fallback
      - summary_features
      - flux_temperature_n_bins
      - flux_temperature_quantiles
      - flux_elevation_n_bins
      - flux_elevation_quantiles
    additionalProperties: false

    properties:
      racs_epoch:
        enum: [low3, mid1]

      flux_min:
        type: number
        exclusiveMinimum: 0

      flux_temperature_min_mjy:
        type: [number, "null"]
        exclusiveMinimum: 0

      fractional_error_flux_min_mjy:
        type: number
        exclusiveMinimum: 0

      local_source_crossmatch_radius_arcsec:
        type: [number, "null"]
        exclusiveMinimum: 0

      nside:
        type: integer
        minimum: 1

      downscale_nside:
        type: [integer, "null"]
        minimum: 1

      use_jax:
        type: boolean

      chunk_size:
        type: integer
        minimum: 1

      paf_temperature_data_dir:
        type: string
        minLength: 1

      openmeteo_fallback:
        type: boolean

      summary_features:
        type: array
        uniqueItems: true
        items:
          enum:
            - log_dispersion
            - flux_quantiles
            - flux_elevation_quantiles

      flux_temperature_n_bins:
        type: integer
        minimum: 1

      flux_temperature_quantiles:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: number
          minimum: 0
          maximum: 1

      flux_elevation_n_bins:
        type: integer
        minimum: 1

      flux_elevation_quantiles:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: number
          minimum: 0
          maximum: 1

  mask:
    type: object
    required:
      - galactic_plane_width_deg
      - north_equatorial_pole_radius_deg
      - default_a_team_radius_deg
      - source_radii_deg
    additionalProperties: false

    properties:
      galactic_plane_width_deg:
        type: number
        minimum: 0
        maximum: 90

      north_equatorial_pole_radius_deg:
        type: number
        minimum: 0
        maximum: 180

      default_a_team_radius_deg:
        type: number
        minimum: 0
        maximum: 180

      source_radii_deg:
        type: object
        required:
          - Cygnus A
          - LMC
          - SMC
        additionalProperties: false
        properties:
          Cygnus A:
            type: number
            minimum: 0
            maximum: 180
          LMC:
            type: number
            minimum: 0
            maximum: 180
          SMC:
            type: number
            minimum: 0
            maximum: 180
