$schema: https://json-schema.org/draft/2020-12/schema

type: object
required: [dataset_id, file_glob, files]
additionalProperties: false

properties:
  dataset_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  file_glob:
    type: string
    minLength: 1
  files:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required: [relative_path, sha256]
      additionalProperties: false
      properties:
        relative_path:
          type: string
          pattern: "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$)).+$"
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
