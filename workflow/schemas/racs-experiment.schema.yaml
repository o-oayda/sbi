$schema: https://json-schema.org/draft/2020-12/schema

type: object
required: [experiment_id, observation_config, execution, args]
additionalProperties: false

properties:
  experiment_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"

  observation_config:
    type: string
    minLength: 1

  execution:
    type: object
    required: [jax_platforms, threads, mem_mb]
    additionalProperties: false
    properties:
      jax_platforms:
        enum: [cpu, cuda]
      threads:
        type: integer
        minimum: 1
      mem_mb:
        type: integer
        minimum: 32_000

  args:
    type: object
    required:
      - mode
      - n_simulations
      - n_rounds
      - ssnle_seed
    not:
      anyOf:
        - required: [racs_epoch]
        - required: [flux_min]
        - required: [flux_temperature_min_mjy]
        - required: [fractional_error_flux_min_mjy]
        - required: [local_source_crossmatch_radius_arcsec]
        - required: [nside]
        - required: [downscale_nside]
        - required: [use_jax]
        - required: [chunk_size]
        - required: [temperature_model]
        - required: [paf_temperature_data_dir]
        - required: [openmeteo_fallback]
        - required: [summary_features]
        - required: [flux_temperature_n_bins]
        - required: [flux_temperature_quantiles]
        - required: [flux_elevation_n_bins]
        - required: [flux_elevation_quantiles]
    properties:
      mode:
        const: NLE
      n_simulations:
        type: integer
        minimum: 1
      n_rounds:
        type: integer
        minimum: 1
      ssnle_seed:
        type: integer
        minimum: 0
      no_ui:
        type: boolean

    # This initial schema checks the most consequential fields while allowing
    # the remaining based_racs.py arguments. Extend the property list and set
    # this to false as the workflow matures.
    additionalProperties: true
